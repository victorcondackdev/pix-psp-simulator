name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "stable"]
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: Resolve modules (brpay)
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage >= 80%
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | awk '/^total:/ { sub("%","",$3); if ($3+0 < 80) { print "coverage below 80%"; exit 1 } }'

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Generate go.sum
        run: go mod tidy

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t pix-psp-simulator:ci .

      - name: Smoke test
        run: |
          docker run -d --name pixsim -p 8080:8080 -e PIXSIM_SCENARIOS=/scenarios/basic.json pix-psp-simulator:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/dict/keys/39053344705 | grep -q '"owner_type": "NATURAL_PERSON"'
          docker logs pixsim
          docker rm -f pixsim
